[project]
name = "lanmate"
version = "0.1.0"
description = "같은 와이파이 안에서 채팅하고 파일을 주고받는다"
readme = "README.md"
authors = [
    { name = "musqat", email = "50176358+musqat@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
lanmate = "lanmate.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
